name: Build SEAM Photo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Normalize Coil requests
        run: |
          sed -i 's/\.crossfade(false)//g' app/src/main/java/ir/seam/photo/MainActivity.kt
          sed -i 's/\.apply{if(m.video)decoderFactory(VideoFrameDecoder.Factory())}//g' app/src/main/java/ir/seam/photo/MainActivity.kt
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: seam-photo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
